[package]
name = "rsshogi-csa-bridge"
version = "0.1.2"
edition = "2021"
rust-version = "1.95"
description = "Plays a USI engine on a CSA protocol shogi server"
license = "MIT"
repository = "https://github.com/nyoki-mtl/rsshogi-csa"
readme = "../../README.md"
publish = false

[lib]
name = "rsshogi_csa_bridge"
path = "src/lib.rs"

[[bin]]
name = "csabridge"
path = "src/bin/csabridge.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rsshogi = { version = "1.1.0", features = ["records"] }
rsshogi-csa = { path = "../rsshogi-csa", version = "0.1.2" }
rsshogi-usi = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "io-std",
    "time",
    "sync",
    "fs",
] }
