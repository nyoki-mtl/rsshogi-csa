name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  windows-x86_64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Build csabridge
        run: cargo build --locked --release -p rsshogi-csa-bridge --bin csabridge

      - name: Verify version
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          $actual = (& target/release/csabridge.exe --version).Split()[-1]
          if ($actual -ne $expected) {
            throw "tag version $expected does not match csabridge version $actual"
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "rsshogi-csa-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/csabridge.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "archive=$name.zip" >> $env:GITHUB_OUTPUT
          "checksum=$name.zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
